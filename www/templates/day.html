<div id="day" class="tab">
    <div class="page-head"><h2 data-i18n="ui.nav.today">Today</h2></div>
    <div class="day-container">
        
        <!-- Sub-navigation tabs -->
        <div class="tabs" role="tablist">
            <button type="button" id="dayTabToday" class="active" role="tab" aria-selected="true" aria-controls="dayTodayContent" data-onclick="day.showSubTab('today')" data-i18n="ui.today.today_s_summary">Summary</button>
            <button type="button" id="dayTabCash" role="tab" aria-selected="false" aria-controls="dayCashContent" data-onclick="day.showSubTab('cash')" data-i18n="ui.today.cash_management">Cash</button>
        </div>

        <!-- Today's Summary: money now (hero, drawer, tiles), Needs attention, Settle today, Details; at ≥ 1280 px a left and a right column -->
        <div id="dayTodayContent" class="day-content today-summary" role="tabpanel" aria-labelledby="dayTabToday">

            <!-- Figures from the phone's cache until the server answers (#59) -->
            <p class="updating-note" data-i18n="ui.sync.figures_updating">Updating… these figures may change when the latest entries arrive.</p>

            <!-- Net cash (T12) with the day's in (T10) and out (T11); in / out open the cash and online split (T6–T9) -->
            <section class="hero" aria-labelledby="todayCashFlowLabel">
                <h2 class="hero-cap" id="todayCashFlowLabel"><span data-i18n="ui.today.net_none">No money in or out yet today</span></h2>
                <button type="button" class="btn btn-primary btn-sm today-new-bill" id="todayNewBill" data-onclick="nav.showTab('billing', event)"><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg><span data-i18n="ui.today.new_bill">New bill</span></button>
                <div class="hero-num" id="todayNetCashFlow">₹0</div>
                <div class="today-inout">
                    <button type="button" class="today-in" data-onclick="day.showInOut()"><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-arrIn"/></svg><span data-i18n="ui.today.total_in">Total in</span> <strong id="todayTotalIn">₹0</strong><svg class="i i-sm today-chev" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
                    <button type="button" class="today-out" data-onclick="day.showInOut()"><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-arrOut"/></svg><span data-i18n="ui.today.total_out">Total out</span> <strong id="todayTotalOut">₹0</strong><svg class="i i-sm today-chev" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></button>
                </div>
                <!-- In and out as shares of one bar (DIRECTION hero: in/out line, stacked meter); the line above is its legend -->
                <div class="meter today-meter" id="todayMeter" aria-hidden="true" hidden></div>
            </section>

            <div class="today-main today-main-top">
            <!-- Cash in drawer (C7, C8): one row from the day's session already loaded; at ≥ 1280 px it heads the right column -->
            <div class="panel today-cashline" id="todayDrawer" hidden></div>

            <!-- Purchases (T1), sales (T2), business (T4) and personal (T5) expenses, the count on the label line -->
            <div class="panel metrics today-metrics">
                <div class="metric panel-tap" role="button" tabindex="0" data-split-tile="purchase" data-onclick="day.showSplit('purchase')">
                    <div class="metric-label"><span class="mode-dot" aria-hidden="true"></span><span data-i18n="ui.common.purchases">Purchases</span><span class="metric-count" id="todayPurchaseCount">0</span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></div>
                    <div class="metric-value" id="todayTotalPurchases">₹0</div>
                </div>
                <div class="metric panel-tap" role="button" tabindex="0" data-split-tile="sale" data-onclick="day.showSplit('sale')">
                    <div class="metric-label"><span class="mode-dot sale" aria-hidden="true"></span><span data-i18n="ui.common.sales">Sales</span><span class="metric-count" id="todaySaleCount">0</span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></div>
                    <div class="metric-value" id="todayTotalSales">₹0</div>
                </div>
                <div class="metric panel-tap" role="button" tabindex="0" data-onclick="nav.showTab('expenses', event)">
                    <div class="metric-label"><span data-i18n="ui.today.business_exp">Business exp.</span><span class="metric-count" id="todayBusinessExpenseCount">0</span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></div>
                    <div class="metric-value" id="todayBusinessExpenses">₹0</div>
                </div>
                <div class="metric panel-tap" role="button" tabindex="0" data-perm="personalExpenses" data-onclick="nav.showTab('expenses', event)">
                    <div class="metric-label"><span data-i18n="ui.today.personal_exp">Personal exp.</span><span class="metric-count" id="todayPersonalExpenseCount">0</span><svg class="i i-sm" aria-hidden="true" focusable="false"><use href="#i-chevR"/></svg></div>
                    <div class="metric-value" id="todayPersonalExpenses">₹0</div>
                </div>
            </div>
            </div>

            <!-- Right column on a desktop: Needs attention, Settle today, Cash and online -->
            <div class="today-side">
            <!-- Needs attention: the Day report (#187, #40, anomalies.js) and Reminders (#86), one line each, closed by default -->
            <section class="today-group today-attention" aria-labelledby="todayAttentionTitle">
                <h3 class="section-title" id="todayAttentionTitle" data-i18n="ui.today.group_attention">Needs attention</h3>
                <div class="panel today-stack">
                    <div id="dayReportCard" class="day-report" style="display: none;"></div>
                    <div id="todayReminders" class="today-reminders" hidden></div>
                </div>
            </section>

            <!-- Settle today: Labour (T-LAB-1, T-LAB-2, T-LAB-4) and Dues today (T13–T16); one line each on a phone, open panels on a desktop -->
            <section class="today-group" aria-labelledby="todaySettleTitle">
                <h3 class="section-title" id="todaySettleTitle" data-i18n="ui.today.group_settle">Settle today</h3>
                <div id="todaySettle"></div>
            </section>

            <!-- Cash and online in (T6, T7) and out (T8, T9): a panel on a desktop; on a phone the in / out sheet -->
            <div id="todayCashOnline" class="today-cashonline"></div>
            </div>

            <!-- Details: Items (T17) and Today's bills (T19) -->
            <div class="today-main">
            <section class="today-group today-details" id="todayDetails" aria-labelledby="todayDetailsTitle" hidden>
                <h3 class="section-title" id="todayDetailsTitle" data-i18n="ui.today.group_details">Details</h3>
                <div id="todayDetailsBody"></div>
            </section>
            </div>

        </div>

        <!-- Cash Management Sub-Tab (Hidden by default) -->
        <div id="dayCashContent" class="day-content" role="tabpanel" aria-labelledby="dayTabCash" style="display: none;">
            <!-- Cash management content will be injected here dynamically -->
            <div id="dayCashManagementContainer"></div>
        </div>

    </div>
</div>
