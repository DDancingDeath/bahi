# Deploys a preview channel on PR to the TEST project bahi-happa-dev (#72). The
# runner builds with config/targets/bahi-happa-dev.json (scripts/happa-config.js
# target), so a preview reads and writes only dev data, never the shop's.
# Channels (bahi-happa-dev--pr<N>-<branch>-<hash>.web.app) expire after 2 days and
# are deleted when the PR closes, so the per-site channel limit isn't reached.
# Skipped until the FIREBASE_SERVICE_ACCOUNT_BAHI_HAPPA_DEV secret exists; the guard
# refuses a key from another project and never targets aadhat-management.

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  checks: write
  contents: read
  pull-requests: write
# A newer event (push, close) cancels the PR's run in flight, so an older deploy
# can't recreate a channel after the close deleted it.
concurrency:
  group: firebase-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build for the test project (bahi-happa-dev)
        run: node scripts/happa-config.js target bahi-happa-dev
      - name: Resolve the test project (refuses aadhat-management)
        id: project
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAHI_HAPPA_DEV }}
        run: node scripts/happa-config.js guard --sa-env SA_JSON
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: steps.project.outputs.ready == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAHI_HAPPA_DEV }}
          projectId: ${{ steps.project.outputs.project_id }}
          expires: 2d

  delete_preview:
    name: Delete preview channels
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Point at the test project (bahi-happa-dev)
        run: node scripts/happa-config.js target bahi-happa-dev
      - name: Resolve the test project (refuses aadhat-management)
        id: project
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAHI_HAPPA_DEV }}
        run: node scripts/happa-config.js guard --sa-env SA_JSON
      # Every site in the built firebase.json (bahi-happa-dev) has its own channel.
      # Channel ids are pr<number>-<branch>; the trailing '-' keeps pr21- from matching pr210-.
      # Channels made on myhappa before previews moved to dev expire on their own (2 days).
      - name: Delete this PR's channels on every site
        if: steps.project.outputs.ready == 'true'
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BAHI_HAPPA_DEV }}
          PROJECT: ${{ steps.project.outputs.project_id }}
          SITES: ${{ steps.project.outputs.sites }}
          # Not PREFIX: npm reads that as its install prefix
          CHANNEL_PREFIX: pr${{ github.event.pull_request.number }}-
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '%s' "$SA_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          failed=0
          for site in ${SITES//,/ }; do
            if ! list=$(npx --yes firebase-tools@latest hosting:channel:list --project "$PROJECT" --site "$site" --json); then
              echo "::warning::Could not list the channels of $site"; failed=1; continue
            fi
            for id in $(jq -r --arg p "$CHANNEL_PREFIX" '.result.channels[]?.name | split("/") | last | select(startswith($p))' <<<"$list"); do
              if npx --yes firebase-tools@latest hosting:channel:delete "$id" --project "$PROJECT" --site "$site" --force; then
                echo "Deleted $site/$id"
              else
                echo "::warning::Could not delete $site/$id (it expires on its own)"; failed=1
              fi
            done
          done
          exit $failed
